<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: #0a0a0a;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  text-align: center;
  overflow-x: hidden;
}

:root {
  --yellow: #CCFF00;
  --gray: #888;
}

/* ─── NAV LOGO (small, top) ─── */
.brand {
  position: absolute;
  top: 28px;
  left: 32px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.06em;
  color: #fff;
  text-decoration: none;
}
.brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); }

/* ─── SCENE ─── */
.scene {
  position: relative;
  width: 380px;
  max-width: 85vw;
  aspect-ratio: 380 / 250;
  margin: 0 auto 8px;
}

.dino-img {
  position: absolute;
  left: 0;
  bottom: 13%;
  width: 72%;
  height: auto;
  filter: drop-shadow(0 18px 24px rgba(120, 60, 220, 0.25));
  animation: idle-bob 3s ease-in-out infinite;
  transform-origin: bottom center;
}

.desk-scene {
  position: absolute;
  right: 8%;
  bottom: 11%;
  width: 38%;
}

/* Blinking cursor on the monitor */
@keyframes blink {
  0%, 45% { opacity: 1; }
  50%, 95% { opacity: 0; }
  100% { opacity: 1; }
}
.cursor { animation: blink 1s step-end infinite; }

/* Screen code lines appearing */
@keyframes typeline1 { 0%, 15% { width: 0; } 40%, 100% { width: 14px; } }
@keyframes typeline2 { 0%, 40% { width: 0; } 65%, 100% { width: 10px; } }
.line1 { animation: typeline1 2.4s ease infinite; }
.line2 { animation: typeline2 2.4s ease infinite; }

/* Ground dashes — subtle nod to the runner track */
.ground-line {
  position: absolute;
  left: 0; right: 0;
  bottom: 9%;
  border-top: 2px dashed #2a2a2a;
}

/* Idle bob for the whole dino */
@keyframes idle-bob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-4px); }
}

/* ─── COPY ─── */
.eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gray);
  margin-top: 12px;
}
h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(28px, 6vw, 40px);
  letter-spacing: -0.02em;
  margin: 10px 0 14px;
}
p.sub {
  font-size: 14px;
  color: #999;
  max-width: 380px;
  line-height: 1.7;
  margin-bottom: 32px;
}

.btn-home {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #CCFF00;
  color: #0a0a0a;
  padding: 14px 30px;
  border-radius: 100px;
  font-size: 15px;
  font-weight: 700;
  text-decoration: none;
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-home:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(204,255,0,0.25); }

footer {
  position: absolute;
  bottom: 24px;
  font-size: 11px;
  color: #444;
}

@media (prefers-reduced-motion: reduce) {
  .cursor, .line1, .line2, .dino-img { animation: none !important; }
}
</style>
